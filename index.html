<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baby ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#070812;
color:white;
overflow-x:hidden;
}

.hero{

height:100vh;

background:
linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.6)),
url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1600");

background-size:cover;
background-position:center;

display:flex;
align-items:center;
justify-content:center;
text-align:center;

}

.hero h1{

font-size:70px;
font-family:"Great Vibes",cursive;
color:#ff8ec6;

}

.hero h2{

font-size:55px;
margin-top:20px;

}

.hero p{

font-size:24px;
margin:20px 0;

}

button{

padding:18px 50px;
font-size:22px;
border:none;
border-radius:50px;
background:#ff4fa3;
color:white;
cursor:pointer;

box-shadow:0 0 30px #ff4fa3;

transition:.3s;

}

button:hover{

transform:scale(1.1);

}

</style>

</head>

<body>

<section class="hero">

<div>

<h1>Muhaz ❤️ Baby</h1>

<h2>Hey Baby...</h2>

<p>8 Years.<br>Countless Memories.</p>

<button>Open My Heart ❤️</button>

</div>

</section>

</body>
</html>
