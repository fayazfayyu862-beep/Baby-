<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Isma ❤️</title>
  <style>
    body {
      margin:0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg,#0f172a,#1e293b,#7c3aed);
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      text-align:center;
      padding:20px;
    }
    .card {
      background: rgba(255,255,255,0.1);
      padding:30px;
      border-radius:20px;
      max-width:500px;
      backdrop-filter: blur(10px);
      box-shadow:0 10px 30px rgba(0,0,0,0.4);
    }
    h1 { font-size:2.2em; }
    p { line-height:1.7; }
    button {
      margin-top:20px;
      padding:12px 24px;
      border:none;
      border-radius:30px;
      background:#ff4d6d;
      color:white;
      font-size:1em;
      cursor:pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>For Isma ❤️</h1>
    <p>
      I was the one who blocked you first.
      That was a stupid decision, and I understand why you got angry.
      I’m not here to win an argument.
      I’m here because I don’t want my ego to be stronger than us.
    </p>
    <p>
      If you’re willing, let’s talk once.
      No drama, no blame — just us.
    </p>
    <button onclick="alert('Thank you for opening this ❤️')">
      One More Chance?
    </button>
  </div>
</body>
</html>
